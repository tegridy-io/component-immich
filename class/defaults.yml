parameters:
  immich:
    =_metadata:
      multi_instance: true
      multi_tenant: true

    namespace: app-${_instance}
    namespaceMetadata: {}

    charts:
      immich:
        source: oci://ghcr.io/immich-app/immich-charts/immich
        version: 0.10.3

    images:
      immich:
        registry: ghcr.io
        repository: immich-app/immich-server
        tag: v2.5.6
      valkey:
        registry: docker.io
        repository: valkey/valkey
        tag: 9.1-alpine
      vectorchord:
        registry: ghcr.io
        repository: tensorchord/cloudnative-vectorchord
        # Ensure compatibility with Immich App
        tag: 17.5-0.4.3

    components:
      server:
        ingress:
          enabled: true
          url: immich.mydomain.local
          annotations:
            nginx.ingress.kubernetes.io/proxy-body-size: '0'
            cert-manager.io/cluster-issuer: 'letsencrypt-production'
        storage:
          mode: 'ReadWriteOnce'
          class: 'ceph-block'
          size: '10Gi'
      database:
        enabled: true
        instances: 1
        storage:
          size: 5Gi
          storageClass: 'ceph-block'
      valkey:
        enabled: false
        storage:
          mode: 'ReadWriteOnce'
          class: 'ceph-block'
          size: '1Gi'
      machineLearning:
        enabled: false
        storage:
          mode: 'ReadWriteOnce'
          class: 'ceph-block'
          size: '10Gi'

    configuration:
      newVersionCheck:
        enabled: false
      storageTemplate:
        enabled: true
        template: "{{y}}/{{y}}-{{MM}}-{{dd}}/{{filename}}"
      trash:
        enabled: false
        days: 30

    helmValues: {}
