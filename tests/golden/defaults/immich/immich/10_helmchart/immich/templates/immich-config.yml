apiVersion: v1
data:
  immich-config.yaml: |
    newVersionCheck:
      enabled: false
    server:
      externalDomain: fotos.tegridy.io
    storageTemplate:
      enabled: true
      template: '{{y}}/{{y}}-{{MM}}-{{dd}}/{{filename}}'
    trash:
      days: 30
      enabled: false
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: immich
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: immich
    app.kubernetes.io/version: v2.6.3
    helm.sh/chart: immich-0.11.1
  name: immich-immich-config
